name: min-ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  min-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ; then
            echo "::error::tracked files contain conflict markers"
            exit 1
          fi
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="origin/${{ github.base_ref }}..HEAD"
